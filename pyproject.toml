[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-mcp-bridge"
version = "0.1.0"
description = "Secure MCP bridge to Grok Bot (Cursor automation webhook), Poke-ready"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
grokbot-mcp-bridge = "app.main:main"

[tool.setuptools]
packages = ["app"]
